<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>怪獸電力公司 - 員工輪班 (圖片版)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height: 100vh;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Arial Black', 'Impact', sans-serif;
    position: relative;
  }

  /* 工廠背景效果 */
  body::before {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(255,255,255,0.02) 50px, rgba(255,255,255,0.02) 100px);
  }

  /* 標題 */
  .logo {
    position: absolute;
    top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 100;
  }
  .company-name {
    font-size: 52px;
    font-weight: 900;
    color: #00d4ff;
    text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff, 0 4px 10px rgba(0,0,0,0.8);
    letter-spacing: 3px;
    margin-bottom: 5px;
  }
  .company-subtitle {
    font-size: 18px;
    color: #ffd700;
    font-weight: 700;
    letter-spacing: 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .container {
    perspective: 1500px;
    position: relative;
    width: 400px;
    height: 550px;
    margin-top: 50px;
  }

  .card {
    position: absolute;
    inset: 0;
    width: 400px;
    height: 550px;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 50px rgba(0,212,255,0.4), 0 0 0 5px rgba(0,212,255,0.3);
    backface-visibility: hidden;
    transform-style: preserve-3d;
    background: linear-gradient(180deg, #1a1a1a 0%, #2d2d2d 100%);
    border: 6px solid #00d4ff;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .card-stripe {
    height: 40px;
    background: repeating-linear-gradient(45deg, #ffd700, #ffd700 20px, #000 20px, #000 40px);
  }

  .monster-display {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #3a3a3a 0%, #1a1a1a 100%);
    position: relative;
    overflow: hidden;
    padding: 20px;
  }

  .monster-display::before {
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(0,212,255,0.3) 0%, transparent 70[]);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 0.8; }
  }

  .monster-img {
    width: 100%;
    height: 100%;
    max-height: 320px;
    object-fit: contain;
    z-index: 2;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  .card-footer {
    height: 80px;
    background: linear-gradient(135deg, #00d4ff, #0099cc);
    display: flex;
    justify-content: center;
    align-items: center;
    border-top: 4px solid #ffd700;
  }

  .employee-badge {
    background: rgba(0,0,0,0.6);
    padding: 12px 30px;
    border-radius: 25px;
    border: 3px solid #ffd700;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  }

  .employee-text {
    color: #ffd700;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
  }

  /* 按鈕 */
  #nextBtn {
    margin-top: 50px;
    padding: 20px 70px;
    font-size: 26px;
    font-weight: 900;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #000;
    border: 5px solid #00d4ff;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255,215,0,0.5), 0 0 40px rgba(0,212,255,0.3);
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 3px;
    z-index: 10;
  }
  #nextBtn:hover {
    background: linear-gradient(135deg, #00d4ff, #00b8e6);
    color: white;
    transform: translateY(-8px) scale(1.08);
    box-shadow: 0 15px 40px rgba(0,212,255,0.7), 0 0 50px rgba(255,215,0,0.5);
  }
  #nextBtn:active { 
    transform: translateY(-2px) scale(1.02); 
  }

  /* 電力指示燈 */
  .power-indicator {
    position: absolute;
    top: 150px;
    right: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .power-light {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #00d4ff;
    box-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .power-text {
    color: #00d4ff;
    font-size: 14px;
    font-weight: 700;
    text-shadow: 0 0 10px #00d4ff;
  }

  /* 15 種超亂往前倒動畫 */
  .fall-1  { animation: fall1  1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-2  { animation: fall2  1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-3  { animation: fall3  1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-4  { animation: fall4  1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-5  { animation: fall5  1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-6  { animation: fall6  1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-7  { animation: fall7  1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-8  { animation: fall8  1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-9  { animation: fall9  1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-10 { animation: fall10 1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-11 { animation: fall11 1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-12 { animation: fall12 1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-13 { animation: fall13 1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-14 { animation: fall14 1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }
  .fall-15 { animation: fall15 1.8s cubic-bezier(0.25,0.8,0.4,1) forwards; }

  @keyframes fall1  { to { transform: translate3d(120px, 700px, -450px) rotateX(82deg) rotateZ(30deg); opacity:0.1; } }
  @keyframes fall2  { to { transform: translate3d(-160px, 680px, -380px) rotateX(88deg) rotateZ(-45deg); opacity:0.05; } }
  @keyframes fall3  { to { transform: translate3d(200px, 720px, -520px) rotateX(75deg) rotateZ(60deg); opacity:0.2; } }
  @keyframes fall4  { to { transform: translate3d(-100px, 740px, -300px) rotateX(90deg) rotateZ(-20deg); opacity:0.15; } }
  @keyframes fall5  { to { transform: translate3d(80px, 660px, -600px) rotateX(78deg) rotateZ(-35deg) rotateY(25deg); opacity:0.2; } }
  @keyframes fall6  { to { transform: translate3d(-220px, 710px, -400px) rotateX(85deg) rotateZ(50deg); opacity:0; } }
  @keyframes fall7  { to { transform: translate3d(180px, 670px, -480px) rotateX(80deg) rotateZ(-55deg); opacity:0.1; } }
  @keyframes fall8  { to { transform: translate3d(0px, 760px, -350px) rotateX(92deg) rotateZ(15deg); opacity:0.05; } }
  @keyframes fall9  { to { transform: translate3d(250px, 730px, -550px) rotateX(70deg) rotateZ(70deg); opacity:0.25; } }
  @keyframes fall10 { to { transform: translate3d(-180px, 700px, -420px) rotateX(87deg) rotateZ(-65deg); opacity:0.1; } }
  @keyframes fall11 { to { transform: translate3d(140px, 750px, -500px) rotateX(83deg) rotateZ(40deg) rotateY(-30deg); opacity:0.15; } }
  @keyframes fall12 { to { transform: translate3d(-130px, 690px, -460px) rotateX(79deg) rotateZ(-40deg); opacity:0.2; } }
  @keyframes fall13 { to { transform: translate3d(300px, 780px, -600px) rotateX(76deg) rotateZ(80deg); opacity:0.05; } }
  @keyframes fall14 { to { transform: translate3d(-250px, 720px, -380px) rotateX(89deg) rotateZ(-75deg); opacity:0; } }
  @keyframes fall15 { to { transform: translate3d(100px, 710px, -700px) rotateX(81deg) rotateZ(360deg); opacity:0; } }
</style>
</head>
<body>

  <div class="logo">
    <div class="company-name">MONSTERS, INC.</div>
    <div class="company-subtitle">WE SCARE BECAUSE WE CARE</div>
  </div>

  <div class="power-indicator">
    <div class="power-light"></div>
    <div class="power-text">POWER</div>
  </div>

  <div class="container" id="container">
    <div class="card" id="currentCard">
      <div class="card-inner">
        <div class="card-stripe"></div>
        <div class="monster-display">
          <img class="monster-img" src="./image/01.png" alt="JOHNNY">
        </div>
        <div class="card-footer">
          <div class="employee-badge">
            <div class="employee-text">JOHNNY</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button id="nextBtn">NEXT</button>

  <script>
    const monsters = [
      { image: './image/01.png', title: 'JOHNNY' },
      { image: './image/02.png', title: 'RANDALL' },
      { image: './image/03.png', title: 'GEORGE' },
      { image: './image/04.png', title: 'CARRIE' },
      { image: './image/06.png', title: 'JAVIER' },
      { image: './image/07.png', title: 'ART' }
    ];

    let currentIndex = 0;

    function changeMonster() {
      currentIndex = (currentIndex + 1) % monsters.length;

      const container = document.getElementById('container');
      const oldCard = document.getElementById('currentCard');
      const newMonster = monsters[currentIndex];

      const newCard = document.createElement('div');
      newCard.className = 'card';
      newCard.innerHTML = `
        <div class="card-inner">
          <div class="card-stripe"></div>
          <div class="monster-display">
            <img class="monster-img" src="${newMonster.image}" alt="${newMonster.title}">
          </div>
          <div class="card-footer">
            <div class="employee-badge">
              <div class="employee-text">${newMonster.title}</div>
            </div>
          </div>
        </div>
      `;
      container.appendChild(newCard);

      // 隨機選一種瘋狂倒下動畫
      const fallClass = 'fall-' + (Math.floor(Math.random() * 15) + 1);
      oldCard.classList.add(fallClass);

      // 動畫結束後移除舊卡片
      oldCard.addEventListener('animationend', function handler() {
        oldCard.removeEventListener('animationend', handler);
        container.removeChild(oldCard);
        newCard.id = 'currentCard';
      });
    }

    // 使用 addEventListener 綁定點擊事件
    document.getElementById('nextBtn').addEventListener('click', changeMonster);
  </script>

</body>
</html>

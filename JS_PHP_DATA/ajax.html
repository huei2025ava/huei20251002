<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ajax</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
     <style>
        table {
            width: 50%;
            margin: auto;
            border-collapse: collapse;
            text-align: center;
        }

        table,
        th,
        td {
            border: 1px solid black;
        }
    </style>
  </head>
  <body>
     <table id="myTable">
        <tr>
            <td>id</td>
            <td>name</td>
            <td>mobile</td>
        </tr>

    </table>
    <script>
      $(document).ready(function () {
        const myTable = $("#myTable");
        console.log('myTable', myTable);
        
        let url = "./data.php";
        $.ajax({
          type: "get",
          url: url,
        //   data: "data",
          dataType: "json",
          success: function (response) {
            console.log("res", response);
            console.log("res typeof:", typeof response);
            let data = response;

            let tmpText = "";
            $.each(data, function (key, value) {
              console.log("key", key);
              console.log("value", value);

              tmpText += `
               <tr>
                   <td>${value.id}</td>
                   <td>${value.name}</td>
                   <td>${value.tel}</td>               
               </tr>
              `;
           
            });
            console.log(tmpText);
            
            myTable.append(tmpText);
          },
        });
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>四則運算計算機</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }

      .container {
        width: 380px;
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
      }

      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 28px;
      }

      .input-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
      }

      input[type="text"],
      select {
        width: 100%;
        padding: 14px;
        border: 2px solid #ddd;
        border-radius: 12px;
        font-size: 18px;
        transition: all 0.3s;
        box-sizing: border-box;
      }

      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
      }

      .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
      }

      .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .result {
        margin-top: 30px;
        padding: 20px;
        background: #f0f2ff;
        border-radius: 12px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        color: #333;
        min-height: 60px;
        border: 3px dashed #667eea;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>四則運算計算機</h1>

      <div class="input-group">
        <label for="num1">數字 1</label>
        <input type="text" id="num1" placeholder="請輸入第一個數字" />
      </div>

      <div class="input-group">
        <label for="num2">數字 2</label>
        <input type="text" id="num2" placeholder="請輸入第二個數字" />
      </div>

      <div class="input-group">
        <label for="operator">運算符號</label>
        <select id="operator">
          <option value="+">＋ 加法</option>
          <option value="-">－ 減法</option>
          <option value="*">× 乘法</option>
          <option value="/">÷ 除法</option>
        </select>
      </div>

      <button class="submit-btn" id="myBtn">立即計算</button>

      <div class="result" id="resultSpan">點擊上方按鈕開始計算～</div>
    </div>

    <script>
      const num1 = document.getElementById("num1");
      const num2 = document.getElementById("num2");
      const operator = document.getElementById("operator");
      const myBtn = document.getElementById("myBtn");
      const resultSpan = document.getElementById("resultSpan");

      myBtn.addEventListener("click", function () {
        const n1 = Number(num1.value);
        const n2 = Number(num2.value);
        const op = operator.value;

        if (num1.value === "" || num2.value === "") {
          resultSpan.innerHTML = "⚠️ 請輸入兩個數字！";
          resultSpan.style.color = "#e74c3c";
          return;
        }

        if (isNaN(n1) || isNaN(n2)) {
          resultSpan.innerHTML = "❌ 只能輸入數字喔！";
          resultSpan.style.color = "#e74c3c";
          return;
        }

        let result; // 先準備一個變數叫 result，用來裝最後算出來的答案（現在還沒值）
        let formula = `${n1} ${op} ${n2} = `; // 準備顯示的「算式」，例如：50 + 30 =
        // 用反引號 ${} 直接把數字跟符號拼起來
        switch (
          op // 根據使用者選的運算符號，決定要做什麼運算
        ) {
          case "+": // 如果選的是 +
            result = n1 + n2; // 就把 n1 + n2 的結果丟進 result 變數
            break; // 做完就跳出 switch

          case "-":
            result = n1 - n2;
            break;

          case "*":
            result = n1 * n2;
            result = (n1 * n2).toFixed(4).replace(/\.?0+$/, "");
            break;

          case "/":
            if (n2 === 0) {
              // 先檢查除數是不是 0（因為不能除以 0）
              resultSpan.innerHTML = "除數不能為 0！"; // 是 0 的話 → 顯示紅色錯誤訊息
              resultSpan.style.color = "#e74c3c"; // 把字變紅色
              return; // return = 直接結束這整段函式，不往下執行了
            } // 這樣產生 Infinity

            result = (n1 / n2).toFixed(4).replace(/\.?0+$/, "");
            // (n1 / n2)              → 先算除法
            // .toFixed(4)            → 強制保留 4 位小數（例如 3.141592）
            // .replace(/\.?0+$/, "") → 再把後面多餘的 0 和小數點砍掉
            //   例如：10 / 2 = 5.0000 → 變成乾淨的 5
            //        10 / 3 = 3.3333 → 保留 3.3333（不會砍掉有意義的數字）
            break;
        }

        resultSpan.innerHTML = formula + result;
        // 把剛剛拼好的「算式」＋「答案」一起顯示出來
        // 例如：50 + 30 = 80

        resultSpan.style.color = "#27ae60";
        // 把結果文字變成綠色
      });

      // 支援 Enter 鍵直接計算
      document.addEventListener("keypress", function (e) {
        if (e.key === "Enter") myBtn.click();
      });
    </script>
  </body>
</html>

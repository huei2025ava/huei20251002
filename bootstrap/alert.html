<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div class="container bg-primary text-white text-center w-50 mt-5">
      <h1>Bootstrap</h1>
    </div>

    <div class="container w-50 mt-5" id="alerthtml"></div>

    <button type="button" class="btn btn-success" id="okBtn">Success</button>
    <button type="button" class="btn btn-danger" id="dangerBtn">Danger</button>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script>
      $(document).ready(function () {
        const okBtn = $("#okBtn");
        const dangerBtn = $("#dangerBtn");
        const alerthtml = $("#alerthtml");

        let okhtml = `
            <div class="alert alert-success alert-dismissible">
              <button type="button" class="btn-close" data-bs-dismiss="alert" id="success-box"></button>
              <strong>Success!</strong> This alert box could indicate a successful or
              positive action.
            </div>
        `;
        let dangerhtml = `
           <div class="alert alert-danger alert-dismissible">
             <button type="button" class="btn-close" data-bs-dismiss="alert" id="danger-box"></button>
             <strong>Danger!</strong> This alert box could indicate a dangerous or
             potentially negative action.
           </div>
        `;

        okBtn.click(function (e) {
          alerthtml.append(okhtml);
        });
        dangerBtn.click(function (e) {
          alerthtml.append(dangerhtml)
        });
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>紅綠燈練習 jQuery</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Kanit', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 50px;
        background-color: #f0f0f0;
      }

      .traffic-light {
        width: 160px;
        height: 400px;
        background-color: #333;
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }

      .light {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background-color: #111; /* 預設暗色 */
        border: 4px solid #222;
        transition: background-color 0.4s ease, box-shadow 0.4s ease;
      }

      /* 亮燈時的樣式 */
      .red.active {
        background-color: #e74c3c;
        box-shadow: 0 0 30px #e74c3c;
      }
      .yellow.active {
        background-color: #f1c40f;
        box-shadow: 0 0 30px #f1c40f;
      }
      .green.active {
        background-color: #2ecc71;
        box-shadow: 0 0 30px #2ecc71;
      }

      .buttons {
        margin-top: 40px;
        display: flex;
        gap: 20px;
      }

      button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        color: white;
      }

      .btn-red {
        background-color: #c0392b;
      }
      .btn-yellow {
        background-color: #e67e22;
      }
      .btn-green {
        background-color: #27ae60;
      }

      button:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1>jQuery Traffic Light</h1>

    <div class="traffic-light">
      <div class="light red" id="redLight"></div>
      <div class="light yellow" id="yellowLight"></div>
      <div class="light green" id="greenLight"></div>
    </div>

    <div class="buttons">
      <button class="btn-red" id="redBtn">RED</button>
      <button class="btn-yellow" id="yellowBtn">YLW</button>
      <button class="btn-green" id="greenBtn">GRN</button>
    </div>

    <script>
      $(document).ready(function () {
        // 1. 先抓到三個燈泡和三個按鈕

        const redLight = $("#redLight");
        const yellowLight = $("#yellowLight");
        const greenLight = $("#greenLight");

        const redBtn = $("#redBtn");
        const yellowBtn = $("#yellowBtn");
        const greenBtn = $("#greenBtn");

        // 2. 寫一個「全部關燈」的函式
        function turnOffAll() {
          redLight.removeClass("active");
          yellowLight.removeClass("active");
          greenLight.removeClass("active");
        }

        // 3. 為每個按鈕加上 active
        redBtn.click(function () {
          console.log("redBtn click ok");
          turnOffAll();
          redLight.addClass("active");
        });

        yellowBtn.click(function () {
          console.log("yellowBtn click ok");
          turnOffAll();
          yellowLight.addClass("active");
        });

        greenBtn.click(function () {
          console.log("greenBtn click ok");
          turnOffAll();
          greenLight.addClass("active");
        });
      });
    </script>
  </body>
</html>

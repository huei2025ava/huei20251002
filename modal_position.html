<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div.relative {
        margin: auto;
        position: relative;
        width: 400px;
        height: 200px;
        background-color: lightseagreen;
        display: none;
      }

      div.absolute {
        position: absolute;
        top: 0;
        right: 0;
        width: 50px;
        height: 50px;
        text-align: center;
        line-height: 50px;
        background-color: lightcoral;
        cursor: pointer;
      }
    </style>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div class="container bg-primary text-white text-center w-50 mt-5">
      <h1>Modal position</h1>
    </div>
    <div class="text-center">
      <button type="button" class="btn btn-success mb-2" id="okBtn">Success</button>
    </div>
    <div class="relative" id="myModal">
      <div class="absolute" id="btn-close">X</div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script>
      $(document).ready(function () {
        const btn = $('#okBtn')
        const myModal = $('#myModal')
        const closeBtn = $('#btn-close')

        btn.click(function () {
            myModal.toggle()
        })
        closeBtn.click(function () {
            myModal.hide()
        })
      });
    </script>
  </body>
</html>

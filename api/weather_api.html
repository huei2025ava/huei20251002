<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div class="container bg-secondary text-white text-center w-75 mt-5">
      <h1>氣象局天氣API</h1>

      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>時段一&nbsp;&nbsp;&nbsp;<span id="time1"></span></th>
            <th>時段二&nbsp;&nbsp;&nbsp;<span id="time2"></span></th>
            <th>時段三&nbsp;&nbsp;&nbsp;<span id="time3"></span></th>
          </tr>
        </thead>
        <tbody id="myTbody"></tbody>
      </table>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script src="../pwd/pwd.js"></script>

    <script>
      $(document).ready(function () {
        const myTbody = $("#myTbody");
        const time1 = $("#time1");
        const time2 = $("#time2");
        const time3 = $("#time3");

        let url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=${pwd}`;

        $.ajax({
          type: "get",
          url: url,
          data: "data",
          dataType: "json",
          success: function (res) {
            console.log(res);
            let data = res.records.location;

            // 開始時間、結束時間
            let time1Start = data[0].weatherElement[0].time[0].startTime;
            let time1End = data[0].weatherElement[0].time[0].endTime;
            let time2Start = data[0].weatherElement[0].time[1].startTime;
            let time2End = data[0].weatherElement[0].time[1].endTime;
            let time3Start = data[0].weatherElement[0].time[2].startTime;
            let time3End = data[0].weatherElement[0].time[2].endTime;

            let time1Date = new Date(time1Start);
            let time1StartHour = time1Date.getHours();
            let timt1EndHour = new Date(time1End).getHours();

            let time2Date = new Date(time2Start);
            let time2StartHour = time2Date.getHours();
            let time2EndHour = new Date(time2End).getHours();

            let time3Date = new Date(time3Start);
            let time3StartHour = time3Date.getHours();
            let time3EndHour = new Date(time3End).getHours();

            let time1String = `${time1StartHour} ~ ${timt1EndHour}`;
            let time2String = `${time2StartHour} ~ ${time2EndHour}`;
            let time3String = `${time3StartHour} ~ ${time3EndHour}`;

            time1.text(time1String);
            time2.text(time2String);
            time3.text(time3String);

            let tmpText = "";
            $.each(data, function (key, value) {
              //   console.log("key", key);
              //   console.log("value", value.locationName);

              // 最高溫、最低溫
              let time1Min =
                value.weatherElement[2].time[0].parameter.parameterName;
              let time2Min =
                value.weatherElement[2].time[1].parameter.parameterName;
              let time3Min =
                value.weatherElement[2].time[2].parameter.parameterName;
              let time1Max =
                value.weatherElement[4].time[0].parameter.parameterName;
              let time2Max =
                value.weatherElement[4].time[1].parameter.parameterName;
              let time3Max =
                value.weatherElement[4].time[2].parameter.parameterName;

              // 天氣描述
              let time1Wx =
                value.weatherElement[0].time[0].parameter.parameterName;
              let time2Wx =
                value.weatherElement[0].time[1].parameter.parameterName;
              let time3Wx =
                value.weatherElement[0].time[2].parameter.parameterName;

              // 天氣圖示代號
              let time1WxValue =
                value.weatherElement[0].time[0].parameter.parameterValue;
              let time2WxValue =
                value.weatherElement[0].time[1].parameter.parameterValue;
              let time3WxValue =
                value.weatherElement[0].time[2].parameter.parameterValue;

              //   console.log("time1Min", time1Min);
              //   console.log("time2Min", time2Min);
              //   console.log("time3Min", time3Min);

              tmpText += `
               <tr>
                 <td>${key + 1}</td>
                 <td>${value.locationName}</td>
                 <td>${time1Min}-${time1Max} °C&nbsp;&nbsp;&nbsp;${time1Wx} <img src="../weather_icon/day/${time1WxValue}.svg" alt=""></td>
                 <td>${time2Min}-${time2Max} °C&nbsp;&nbsp;&nbsp;${time1Wx} <img src="../weather_icon/day/${time2WxValue}.svg" alt=""></td>
                 <td>${time3Min}-${time3Max} °C&nbsp;&nbsp;&nbsp;${time1Wx} <img src="../weather_icon/day/${time3WxValue}.svg" alt=""></td>
               </tr>
              `;
            });
            myTbody.append(tmpText);
          },
        });
      });
    </script>
  </body>
</html>

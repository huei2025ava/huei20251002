<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新北市飯店查詢</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1a1a2e;
        --gold: #c9a84c;
        --gold-light: #e8c97a;
        --cream: #f5f0e8;
        --warm-white: #faf8f4;
        --muted: #7a7060;
        --border: #d4c9b0;
        --shadow: rgba(26,26,46,0.12);
        --row-hover: #f0ebe0;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Noto Sans TC', sans-serif;
        background: var(--cream);
        min-height: 100vh;
        color: var(--ink);
        overflow-x: hidden;
      }

      /* === BACKGROUND PATTERN === */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(circle at 20% 20%, rgba(201,168,76,0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(26,26,46,0.06) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
      }

      .page-wrapper {
        position: relative;
        z-index: 1;
        max-width: 1000px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }

      /* === HEADER === */
      .header {
        text-align: center;
        margin-bottom: 48px;
        animation: fadeDown 0.7s ease both;
      }

      .header-badge {
        display: inline-block;
        font-family: 'Noto Serif TC', serif;
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--gold);
        text-transform: uppercase;
        border-top: 1px solid var(--gold);
        border-bottom: 1px solid var(--gold);
        padding: 6px 20px;
        margin-bottom: 20px;
      }

      h1 {
        font-family: 'Noto Serif TC', serif;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        color: var(--ink);
        line-height: 1.2;
        letter-spacing: 0.05em;
      }

      h1 span {
        color: var(--gold);
      }

      .header-sub {
        margin-top: 12px;
        font-size: 14px;
        color: var(--muted);
        letter-spacing: 1px;
      }

      /* === FILTER CARD === */
      .filter-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 28px 32px;
        margin-bottom: 32px;
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
        box-shadow: 0 4px 24px var(--shadow);
        animation: fadeUp 0.7s 0.1s ease both;
      }

      .filter-label {
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .select-wrapper {
        position: relative;
        flex: 1;
        min-width: 200px;
      }

      .select-wrapper::after {
        content: '▾';
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gold);
        pointer-events: none;
        font-size: 14px;
      }

      select {
        width: 100%;
        appearance: none;
        background: var(--warm-white);
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 12px 40px 12px 16px;
        font-family: 'Noto Sans TC', sans-serif;
        font-size: 14px;
        color: var(--ink);
        cursor: pointer;
        transition: border-color 0.2s, box-shadow 0.2s;
        letter-spacing: 0.5px;
      }

      select:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(201,168,76,0.15);
      }

      .result-count {
        margin-left: auto;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .result-count strong {
        color: var(--gold);
        font-size: 18px;
        font-family: 'Noto Serif TC', serif;
      }

      /* === TABLE CARD === */
      .table-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 2px;
        overflow: hidden;
        box-shadow: 0 4px 24px var(--shadow);
        animation: fadeUp 0.7s 0.2s ease both;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead {
        background: var(--ink);
      }

      thead th {
        font-family: 'Noto Serif TC', serif;
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--gold-light);
        font-weight: 600;
        padding: 18px 20px;
        text-align: left;
        white-space: nowrap;
      }

      thead th:first-child {
        text-align: center;
        width: 60px;
      }

      tbody tr {
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
        animation: rowFade 0.4s ease both;
      }

      tbody tr:last-child {
        border-bottom: none;
      }

      tbody tr:hover {
        background: var(--row-hover);
      }

      tbody td {
        padding: 16px 20px;
        font-size: 14px;
        color: var(--ink);
        line-height: 1.5;
        vertical-align: middle;
      }

      tbody td:first-child {
        text-align: center;
        font-family: 'Noto Serif TC', serif;
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }

      .hotel-name {
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .address-text {
        color: var(--muted);
        font-size: 13px;
      }

      .phone-text {
        font-family: monospace;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.5px;
      }

      .room-badge {
        display: inline-block;
        background: var(--cream);
        border: 1px solid var(--border);
        color: var(--ink);
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 20px;
        letter-spacing: 1px;
        font-weight: 500;
      }

      /* === EMPTY STATE === */
      .empty-state {
        padding: 64px 32px;
        text-align: center;
        color: var(--muted);
      }

      .empty-icon {
        font-size: 40px;
        margin-bottom: 16px;
        opacity: 0.4;
      }

      .empty-state p {
        font-size: 14px;
        letter-spacing: 1px;
      }

      /* === LOADING === */
      .loading-row td {
        text-align: center;
        padding: 48px;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 2px;
      }

      .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 2px solid var(--border);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 10px;
      }

      /* === FOOTER === */
      .table-footer {
        padding: 14px 24px;
        background: var(--warm-white);
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 1px;
        text-align: right;
      }

      /* === DECORATIVE LINE === */
      .deco-line {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .deco-line::before, .deco-line::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .deco-dot {
        width: 5px;
        height: 5px;
        background: var(--gold);
        border-radius: 50%;
      }

      /* === ANIMATIONS === */
      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes rowFade {
        from { opacity: 0; transform: translateX(-8px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">

      <!-- HEADER -->
      <div class="header">
        <div class="header-badge">New Taipei City</div>
        <h1>新北市<span>飯店</span>查詢</h1>
        <p class="header-sub">Hotel Directory · 住宿資訊總覽</p>
      </div>

      <!-- FILTER -->
      <div class="filter-card">
        <span class="filter-label">篩選行政區</span>
        <div class="select-wrapper">
          <select id="districtSelect">
            <option value="all">— 全部行政區 —</option>
          </select>
        </div>
        <div class="result-count">
          共 <strong id="countNum">—</strong> 間飯店
        </div>
      </div>

      <!-- TABLE -->
      <div class="table-card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>飯店名稱</th>
                <th>地址</th>
                <th>聯絡電話</th>
                <th>房間數</th>
              </tr>
            </thead>
            <tbody id="myTbody">
              <tr class="loading-row">
                <td colspan="5">
                  <span class="spinner"></span>載入資料中...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="table-footer" id="tableFooter"></div>
      </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
      $(document).ready(function () {
        const myTbody = $('#myTbody');
        const districtSelect = $('#districtSelect');
        const countNum = $('#countNum');
        const tableFooter = $('#tableFooter');
        let allData = [];

        // 從地址解析行政區（抓取「○○區」）
        function parseDistrict(address) {
          const match = address.match(/新北市(.{2,3}區)/);
          return match ? match[1] : '其他';
        }

        // 渲染表格
        function renderTable(data) {
          myTbody.empty();
          if (data.length === 0) {
            myTbody.html(`
              <tr>
                <td colspan="5">
                  <div class="empty-state">
                    <div class="empty-icon">🏨</div>
                    <p>此行政區目前無飯店資料</p>
                  </div>
                </td>
              </tr>
            `);
            countNum.text('0');
            tableFooter.text('');
            return;
          }

          let html = '';
          $.each(data, function (i, value) {
            html += `
              <tr style="animation-delay: ${i * 0.04}s">
                <td>${i + 1}</td>
                <td><span class="hotel-name">${value.name}</span></td>
                <td><span class="address-text">${value.address}</span></td>
                <td><span class="phone-text">${value.localcallservice}</span></td>
                <td><span class="room-badge">${value.room} 間</span></td>
              </tr>
            `;
          });

          myTbody.html(html);
          countNum.text(data.length);

          const district = districtSelect.val();
          const label = district === 'all' ? '全部行政區' : district;
          tableFooter.text(`顯示「${label}」共 ${data.length} 筆資料`);
        }

        // 載入資料
        $.ajax({
          type: 'get',
          url: '../hotel.json',
          dataType: 'json',
          success: function (response) {
            allData = response;

            // 收集所有行政區並排序
            const districts = new Set();
            $.each(allData, function (i, v) {
              districts.add(parseDistrict(v.address));
            });

            // 排序行政區
            const sorted = Array.from(districts).sort();
            $.each(sorted, function (i, d) {
              districtSelect.append(`<option value="${d}">${d}</option>`);
            });

            // 初始渲染全部
            renderTable(allData);
          },
          error: function () {
            myTbody.html(`
              <tr>
                <td colspan="5">
                  <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <p>無法載入資料，請確認 hotel.json 路徑是否正確</p>
                  </div>
                </td>
              </tr>
            `);
            countNum.text('—');
          }
        });

        // 下拉選單篩選
        districtSelect.on('change', function () {
          const val = $(this).val();
          if (val === 'all') {
            renderTable(allData);
          } else {
            const filtered = allData.filter(function (v) {
              return parseDistrict(v.address) === val;
            });
            renderTable(filtered);
          }
        });
      });
    </script>
  </body>
</html>

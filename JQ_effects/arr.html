<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery arry</title>
    <style>
        .container {
            width: 100%;
            margin: auto;
            display: flex;
            justify-content: space-around;
        }
        .box {
            width: 300px;
            height: 300px;
            background-color: lightpink;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script>
            $(document).ready(function () {
                let myArr = [1, 2, 3, 4, 5]
                console.log('myArr:', myArr);
                console.log('myArr typeof:', typeof(myArr));
                console.log('Array.isArray(myArr)',Array.isArray(myArr));
                
                myArr.forEach(function (value, key) {
                    // key index
                    // value item element
                    console.log('key', key);
                    console.log('value', value);
                })
                let myObj = {
                    'id': 1,
                    'name': 'Sherlock',
                    'mobile': '0922'
                }
                console.log('myObj', myObj);
                console.log('myObj typeof:', typeof(myObj));
                console.log('Array.isArray(myObj)',Array.isArray(myObj));
                // myObj，物件不是陣列
                // object 不能用 forEach，forEach只能用在陣列
                for (let key in myObj) {
                    console.log('key', key);
                    console.log('value', myObj[key]);
                }

                const box = document.querySelectorAll('.box');
                console.log('box:', box);
                console.log('typeof box:', typeof box);
                console.log('Array.isArray(box)',Array.isArray(box));
                
                // NodeList 不是Array，Array的方法不能用，但只有forEach可以使用

                box.forEach((item, index) => {
                    console.log('item:', item);
                    console.log('index:', index);         
                });
                
            })
        </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 50%;
        margin: auto;
        margin-top: 50px;
        padding: 10px;
        text-align: center;
      }
      .container-input {
        background-color: lightcoral;
      }
      h2 {
        text-align: center;
      }
      .bg-red {
      background-color: lightpink;
      }
      .bg-yellow {
        background-color: lightyellow;
      }
      .bg-blue {
        background-color: lightskyblue;
      }
   
    </style>
  </head>

  <body>
    <div class="container container-input">
      <form action="" method="get" id="myForm">
        <p>
          <label for="num1"></label>
          <input type="number" name="num1" id="num1" value="100" />
        </p>
        <p>
          <label for="num2"></label>
          <input type="number" name="num2" id="num2" value="50" />
        </p>
        <p>
          <label for="opt"></label>
          <select name="opt" id="opt">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
          </select>
        </p>
        <p>
          <div>
            <input type="radio" id="red" name="color"  value="red" checked />
            <label for="huey">red</label>
          </div>
        
          <div>
            <input type="radio" id="yellow" name="color" value="yellow"/>
            <label for="dewey">yellow</label>
          </div>
        
          <div>
            <input type="radio" id="blue" name="color"  value="blue"/>
            <label for="louie">blue</label>
          </div>
        </p>
        <p>
          <button type="submit" id="btnCalc">計算</button>
        </p>
      </form>
    </div>
    <div class="container container-output">
      <h2>結果: <span id="result">0</span></h2>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script>
      $(document).ready(function () {
        // 1.bind
        const num1 = $("#num1");
        const num2 = $("#num2");
        const opt = $("#opt");
        const btnCalc = $("#btnCalc");
        const result = $("#result");

        const myForm = $("#myForm");

        const output = $('.container-output')

        // 2.action
        $(myForm).submit(function (e) {
          e.preventDefault();

          let url = "./result.php";
          let formData = myForm.serialize();

          $.ajax({
            type: "GET",
            url: url,
            data: formData,
            dataType: "json",
            success: function (response) {
              console.log("response:", response);
              result.text(response.textResult);
              // output.css('background-color', response.color)
              output.attr('class', response.bgColor)
            },
          });
        });
      });
    </script>
  </body>
</html>
